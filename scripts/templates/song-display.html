<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DISPLAY_DATE}} 艺术评论记录：{{TITLE}}。">
  <title>{{DISPLAY_DATE}} {{TITLE}} | 艺术评论 | Lihui Gao</title>
  <link rel="icon" href="{{ROOT}}/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}/assets/css/styles.css">
  <link rel="stylesheet" href="{{ROOT}}/assets/css/music-visualizer.css?v=20261029-art">
</head>
<body class="music-art-page">
<header class="music-site-header">
  <a class="music-home" href="{{ROOT}}/index.html">Lihui Gao</a>
  <nav aria-label="页面导航"><a href="{{ART_INDEX}}">艺术评论</a><a href="{{ROOT}}/life.html">生活记录</a></nav>
</header>
<main id="top">
<article class="post music-page music-experience" data-music-player data-song-title="{{TITLE}}" data-duration="{{DURATION}}"{{TIMINGS_ATTR}}>
  <section class="music-stage" aria-labelledby="music-title">
    <div class="music-spectrum" hidden><canvas aria-hidden="true"></canvas><span class="music-spectrum-status" role="status">播放后显示实时频谱</span></div>
    <div class="music-stage-content">
      <div class="music-record-side">
        <p class="music-edition"><span>艺术评论</span><time datetime="{{DATE}}">{{DISPLAY_DATE}}</time></p>
        <div class="music-record-wrap">
          <button class="music-record-button" type="button" data-play-toggle aria-label="播放 {{TITLE}}" hidden>
            <span class="music-record" aria-hidden="true">
              <span class="music-record-label"><span>{{RECORD_TITLE}}</span><span class="music-record-hole"></span><small>{{RECORD_PERFORMER}}</small></span>
            </span>
          </button>
          <noscript><div class="music-record" aria-hidden="true"><span class="music-record-label">{{RECORD_TITLE}}</span></div></noscript>
          <span class="music-record-arm" aria-hidden="true"><i></i></span>
          <p class="music-record-hint" hidden>点击唱片播放</p>
        </div>
        <h1 class="music-title" id="music-title"><span class="visually-hidden">{{DISPLAY_DATE}} </span>{{TITLE}}</h1>
        <p class="music-performer">{{PERFORMER}}</p>
        <audio class="life-song-player music-native-player" controls preload="metadata" aria-label="{{TITLE}}，{{PERFORMER}} 演唱">
          <source src="{{MEDIA}}" type="{{MEDIA_TYPE}}">
          你的浏览器不支持音频播放，可<a href="{{MEDIA}}">打开音频文件</a>。
        </audio>
      </div>
      <div class="music-lyric-side">
        <div class="music-lyrics-heading">
          <h2 id="lyrics-heading">歌词</h2>
          <div class="music-lyrics-toolbar" hidden><label><input type="checkbox" data-lyrics-follow checked>歌词跟随</label></div>
        </div>
        <section class="song-lyrics" lang="{{LYRICS_LANG}}" aria-labelledby="lyrics-heading">
{{LYRICS}}
</section>
        <p class="music-lyrics-help" hidden>点击歌词可跳转 · 滚动可自由阅读</p>
      </div>
    </div>
    <div class="music-transport" hidden>
      <button class="music-control" type="button" data-play-toggle aria-label="播放 {{TITLE}}">
        <svg class="music-play-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4v16l13-8z" fill="currentColor"/></svg>
        <svg class="music-pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z" fill="currentColor"/></svg>
      </button>
      <output class="music-time" data-music-elapsed aria-label="已播放">0:00</output>
      <input class="music-seek" type="range" min="0" max="{{DURATION}}" value="0" step="0.1" data-music-seek aria-label="播放进度">
      <output class="music-time" data-music-duration aria-label="总时长">{{DURATION_TEXT}}</output>
      <button class="music-control music-volume" type="button" data-music-mute aria-label="静音" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <label><input type="checkbox" data-spectrum-toggle>动效</label>
    </div>
    <a class="music-note-link" href="#music-note">随记与留言 ↓</a>
  </section>
  <div class="post-content music-afterword" id="music-note">
    <p class="section-label">随记</p>
    {{NOTE}}
    <p class="music-credit">{{CREDIT}}</p>
    <details class="music-lyrics-timing" hidden>
      <summary>歌词时间微调</summary>
      {{TIMING_DESCRIPTION}}
      <div>
        <button type="button" data-lyrics-adjust="-0.5">提前 0.5 秒</button>
        <output data-lyrics-offset aria-live="polite">原始时间</output>
        <button type="button" data-lyrics-adjust="0.5">延后 0.5 秒</button>
        <button type="button" data-lyrics-adjust="reset">还原</button>
      </div>
    </details>
  </div>
  <nav class="post-nav"><a href="{{ART_INDEX}}">← 返回艺术评论</a></nav>
</article>
</main>
<footer class="site-footer"><p>© <span id="year"></span> Lihui Gao</p><a href="#top">返回唱片</a></footer>
<script defer src="{{ROOT}}/assets/js/music-visualizer.js?v=20261104-template"></script>
<script src="{{ROOT}}/assets/js/main.js"></script>
</body>
</html>
