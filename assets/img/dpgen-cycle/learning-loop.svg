<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="title desc">
<title id="title">The DP-GEN learning cycle</title>
<desc id="desc">Training data feed a committee, which explores and selects new geometries. Quantum chemistry labels selected geometries. Only validated distinct labels expand the dataset for the next iteration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#416979"/></marker></defs>
<rect width="420" height="760" fill="#fafbfc"/>
<path d="M95 691 H35 V61 H95" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<text x="22" y="376" transform="rotate(-90 22 376)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#416979">Next iteration · expanded dataset</text>
<rect x="95" y="16" width="300" height="90" rx="7" fill="#e9f1f4" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">Training dataset</text>
<text x="245" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Seed + accepted additions</text>
<path d="M245 124 V138" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="142" width="300" height="90" rx="7" fill="#ffffff" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">1 · Train committee</text>
<text x="245" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Same data; independent seeds</text>
<path d="M245 250 V264" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="268" width="300" height="90" rx="7" fill="#ffffff" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">2 · Explore</text>
<text x="245" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">One leader; all members inspect</text>
<path d="M245 376 V390" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="394" width="300" height="90" rx="7" fill="#ffffff" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">3 · Select</text>
<text x="245" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Spread + geometry + diversity</text>
<text x="245" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Within the labeling budget</text>
<path d="M245 502 V516" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="520" width="300" height="90" rx="7" fill="#ffffff" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">4 · Label</text>
<text x="245" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Same-protocol quantum chemistry</text>
<path d="M245 628 V642" fill="none" stroke="#416979" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="646" width="300" height="90" rx="7" fill="#ffffff" stroke="#93abb4" stroke-width="1.3"/>
<text x="245" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e4d">5 · Validate and merge</text>
<text x="245" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465861">Accept distinct, usable labels</text>
</svg>
