<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445" role="img" aria-labelledby="title desc">
<title id="title">CASSCF active, inactive and external orbital occupations</title>
<desc id="desc">There are 51 doubly occupied inactive spatial orbitals with 102 electrons and 9 active spatial orbitals containing 12 electrons. Two illustrative active occupation patterns contain twelve dots each. No actual orbital energies, CI weights or state assignment is implied.</desc>
<rect width="100%" height="100%" fill="#fbfbfa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="26.000" y="32.000" font-size="22" fill="#222222" text-anchor="start" font-weight="bold">An occupation model for 114 electrons</text><text x="26.000" y="62.000" font-size="15" fill="#666666" text-anchor="start" font-weight="normal">Orbital shapes are optimized; these boxes specify allowed occupancies.</text><rect x="26" y="84" width="588" height="68" rx="5" fill="#f1f2ef" stroke="#deded8"/><text x="43.000" y="112.000" font-size="18" fill="#222222" text-anchor="start" font-weight="bold">Inactive sector: 51 doubly occupied spatial orbitals</text><text x="43.000" y="136.000" font-size="15" fill="#666666" text-anchor="start" font-weight="normal">102 electrons remain paired in every included configuration.</text><text x="26.000" y="184.000" font-size="19" fill="#315f7d" text-anchor="start" font-weight="bold">Active sector: 12 electrons in 9 spatial orbitals</text><text x="30.000" y="235.000" font-size="18" fill="#315f7d" text-anchor="start" font-weight="bold">A</text><rect x="72" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="87" cy="228" r="4" fill="#315f7d"/><circle cx="101" cy="228" r="4" fill="#315f7d"/><text x="94.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">1</text><rect x="131" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="146" cy="228" r="4" fill="#315f7d"/><circle cx="160" cy="228" r="4" fill="#315f7d"/><text x="153.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">2</text><rect x="190" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="205" cy="228" r="4" fill="#315f7d"/><circle cx="219" cy="228" r="4" fill="#315f7d"/><text x="212.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">3</text><rect x="249" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="264" cy="228" r="4" fill="#315f7d"/><circle cx="278" cy="228" r="4" fill="#315f7d"/><text x="271.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">4</text><rect x="308" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="323" cy="228" r="4" fill="#315f7d"/><circle cx="337" cy="228" r="4" fill="#315f7d"/><text x="330.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">5</text><rect x="367" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="382" cy="228" r="4" fill="#315f7d"/><circle cx="396" cy="228" r="4" fill="#315f7d"/><text x="389.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">6</text><rect x="426" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><text x="448.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">7</text><rect x="485" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><text x="507.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">8</text><rect x="544" y="208" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><text x="566.000" y="203.000" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">9</text><text x="30.000" y="312.000" font-size="18" fill="#315f7d" text-anchor="start" font-weight="bold">B</text><rect x="72" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="87" cy="305" r="4" fill="#315f7d"/><circle cx="101" cy="305" r="4" fill="#315f7d"/><rect x="131" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="146" cy="305" r="4" fill="#315f7d"/><circle cx="160" cy="305" r="4" fill="#315f7d"/><rect x="190" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="205" cy="305" r="4" fill="#315f7d"/><circle cx="219" cy="305" r="4" fill="#315f7d"/><rect x="249" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="264" cy="305" r="4" fill="#315f7d"/><circle cx="278" cy="305" r="4" fill="#315f7d"/><rect x="308" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="323" cy="305" r="4" fill="#315f7d"/><circle cx="337" cy="305" r="4" fill="#315f7d"/><rect x="367" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="382" cy="305" r="4" fill="#315f7d"/><rect x="426" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><circle cx="441" cy="305" r="4" fill="#315f7d"/><rect x="485" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><rect x="544" y="285" width="44" height="40" rx="3" fill="#ffffff" stroke="#315f7d" stroke-width="1.5"/><text x="26.000" y="370.000" font-size="16" fill="#666666" text-anchor="start" font-weight="normal">External orbitals are empty in every included configuration.</text><text x="26.000" y="405.000" font-size="15" fill="#666666" text-anchor="start" font-weight="normal">A and B are illustrative occupations, not measured CI weights.</text><text x="26.000" y="427.000" font-size="14" fill="#666666" text-anchor="start" font-weight="normal">Spin-adapted singlet states combine determinants with the required spin.</text>
</g>
</svg>
