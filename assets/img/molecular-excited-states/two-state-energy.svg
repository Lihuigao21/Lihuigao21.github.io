<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title id="title">Actual two-state total energies and their state-average objective</title>
<desc id="desc">At one completed reference geometry S1 is 3.141262 eV above S0. The dashed equal-weight mean is the orbital-optimization objective. No orbital eigenvalues or potential-energy curve is shown.</desc>
<rect width="100%" height="100%" fill="#fbfbfa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28.000" y="34.000" font-size="21" fill="#222222" text-anchor="start" font-weight="bold">Two electronic states at one fixed geometry</text><text x="28.000" y="62.000" font-size="16" fill="#666666" text-anchor="start" font-weight="normal">Relative total energy, E − E0 (eV)</text><line x1="102.000" y1="75.000" x2="102.000" y2="352.000" stroke="#666666" stroke-width="1.5"/><line x1="97.000" y1="345.000" x2="108.000" y2="345.000" stroke="#666666" stroke-width="1.5"/><text x="89.000" y="350.000" font-size="16" fill="#666666" text-anchor="end" font-weight="normal">0</text><line x1="97.000" y1="270.000" x2="108.000" y2="270.000" stroke="#666666" stroke-width="1.5"/><text x="89.000" y="275.000" font-size="16" fill="#666666" text-anchor="end" font-weight="normal">1</text><line x1="97.000" y1="195.000" x2="108.000" y2="195.000" stroke="#666666" stroke-width="1.5"/><text x="89.000" y="200.000" font-size="16" fill="#666666" text-anchor="end" font-weight="normal">2</text><line x1="97.000" y1="120.000" x2="108.000" y2="120.000" stroke="#666666" stroke-width="1.5"/><text x="89.000" y="125.000" font-size="16" fill="#666666" text-anchor="end" font-weight="normal">3</text><line x1="152.000" y1="345.000" x2="362.000" y2="345.000" stroke="#315f7d" stroke-width="4"/><text x="160.000" y="332.000" font-size="20" fill="#315f7d" text-anchor="start" font-weight="bold">S0</text><text x="390.000" y="350.000" font-size="16" fill="#315f7d" text-anchor="start" font-weight="normal">-683.9835723 Ha</text><line x1="152.000" y1="109.405" x2="362.000" y2="109.405" stroke="#a3654a" stroke-width="4"/><text x="160.000" y="96.405" font-size="20" fill="#a3654a" text-anchor="start" font-weight="bold">S1</text><text x="390.000" y="114.405" font-size="16" fill="#a3654a" text-anchor="start" font-weight="normal">-683.8681331 Ha</text><line x1="148.000" y1="227.203" x2="366.000" y2="227.203" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/><text x="390.000" y="219.203" font-size="16" fill="#666666" text-anchor="start" font-weight="normal">Equal-weight mean</text><text x="390.000" y="242.203" font-size="15" fill="#666666" text-anchor="start" font-weight="normal">-683.9258527 Ha</text><line x1="330.000" y1="117.405" x2="330.000" y2="337.000" stroke="#315f7d" stroke-width="1.5"/><path d="M 326 123.405 L 330 116.405 L 334 123.405 M 326 331.000 L 330 338.000 L 334 331.000" fill="none" stroke="#315f7d" stroke-width="1.5"/><text x="168.000" y="389.000" font-size="20" fill="#315f7d" text-anchor="start" font-weight="bold">Excitation gap: 3.141262 eV</text><text x="28.000" y="424.000" font-size="14" fill="#666666" text-anchor="start" font-weight="normal">The dashed line is an optimization objective, not a third electronic state.</text>
