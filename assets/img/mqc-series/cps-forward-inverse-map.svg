   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(172.488125 111.885622)">Quantum operator ρ</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(102.465859 126.442778)">Populations and coherences in one matrix</text>
   </g>
