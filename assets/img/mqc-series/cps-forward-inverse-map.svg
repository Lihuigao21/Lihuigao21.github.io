      <tspan x="25.035156" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">)</tspan>
      <tspan x="32.639648" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">=</tspan>
      <tspan x="46.064941" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">T</tspan>
      <tspan x="54.005859" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">r</tspan>
      <tspan x="59.350586" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">(</tspan>
      <tspan x="86.940039" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'">)</tspan>
      <tspan x="15.780273" y="-0.125" style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'">n</tspan>
     </text>
    </g>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(119.127187 297.022488)">Scalar function on every Bloch direction</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(164.444063 310.459862)">Its values can be signed;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(107.810625 323.897238)">they are not individual physical populations</text>
   </g>
