    <main id="top"><article class="post life-post"><header class="post-header"><p class="section-label">梦与创造</p><h1>2026.08.11 感情就跟梦一样</h1><p class="post-meta">2026.08.11 - 生活记录 / 梦与创造</p></header><div class="post-content">
      <p>昨天似乎又梦见了两次她，但我完全忘了内容了，甚至不确定是否真的梦见了。我对她的感情现在就跟梦一样，不知道哪个更飘渺一点。感情就是这种飘渺的东西啊，前一天两个人还能亲昵耳语，后一天立马形同陌路；有人把它当信仰，有人把它当游戏。怎么能将人生的意义建立在这种东西上呢？</p>
